# Model routing table — CONFIGURATION, not architecture.
#
# Copy to config/models.yaml to change routing without touching Python. The
# loader prefers models.yaml and falls back to this file.
#
# NO CLAUDE. NO ANTHROPIC. Not as a primary, not as a fallback, not as an
# unknown-role default, not as an enabled adapter. `validate_no_claude_runtime`
# in orchestrator/model_router.py enforces this and a test asserts it.
#
# Prices below are USD per MILLION tokens and were verified LIVE against
# https://openrouter.ai/api/v1/models on 2026-08-18. They are estimates used for
# PRE-CALL budgeting. Actual spend is taken from Pi's provider-reported per-call
# usage whenever the provider supplies it (cost_source: provider_reported).

adapters:
  pi:
    executable: pi
    # Verified against the installed Pi 0.84.2 (`pi --help`, docs/rpc.md):
    #   --mode rpc         JSONL protocol over stdin/stdout  <- the runtime path
    #   --mode json        one-shot event stream on stdout   <- legacy print path
    #   --provider/--model provider and model selection
    #   -nt / --no-tools   no tools at all (reviewer / resolver / scout)
    #   -t  / --tools      strict allowlist for built-in AND extension tools
    #   --thinking <level> off|minimal|low|medium|high|xhigh|max
    #   --no-extensions    disable discovery; explicit `-e` still applies
    rpc_mode_flag: ["--mode", "rpc"]
    json_mode_flag: ["--mode", "json"]
    print_flag: "-p"
    enabled: true
  # The Claude CLI adapter is REMOVED, not merely disabled. Claude is not a
  # runtime worker, reviewer, resolver or fallback in this control plane.

providers:
  # ------------------------------------------------------- local GPU / free
  local_llama:
    kind: local
    paid: false
    # Registered in Pi by an extension that declares the provider and its four
    # models. The extension resolves its own credential from the environment;
    # this orchestrator never reads, stores or prints it.
    pi_provider: local-llama
    # `--no-extensions` is passed to every bounded worker, so the local provider
    # extension must be named explicitly for a local run to resolve its model.
    pi_extension: /root/.pi/local-llama-ext.js
    api_key_env: LOCAL_LLAMA_KEY      # presence only; value never read here

  # ------------------------------------------------------ OpenRouter / paid
  openrouter:
    kind: cloud
    paid: true
    pi_provider: openrouter
    api_key_env: OPENROUTER_API_KEY
    catalog: /root/.pi/agent/models-store.json   # non-secret; carries cost metadata

# ---------------------------------------------------------------- the models
#
# `family` drives the diversity policy: a review must not come from the family
# that wrote the code.
#
# LOCAL MODELS: being listed here means CONFIGURED. Being in Pi's extension
# means REGISTERED. Neither means AVAILABLE. Availability is a live probe of
# `base_url` (see ModelRouter.availability / Presence), and `doctor` reports the
# three states separately. This orchestrator never starts or stops a GPU server.
models:
  qwen3.8-27b:
    provider: local_llama
    id: qwen3.8-27b
    family: qwen
    base_url: http://127.0.0.1:8093
    base_url_env: LOCAL_LLAMA_QWEN38_URL
    context: 65536
    reasoning_capable: true
    cost_usd_per_mtok: {input: 0.0, output: 0.0}

  qwen3.6-35b:
    provider: local_llama
    id: qwen3.6-35b
    family: qwen
    base_url: http://127.0.0.1:8091
    base_url_env: LOCAL_LLAMA_URL
    context: 65536
    reasoning_capable: false
    cost_usd_per_mtok: {input: 0.0, output: 0.0}

  qwen3-coder-30b:
    provider: local_llama
    id: qwen3-coder-30b
    family: qwen
    base_url: http://127.0.0.1:8090
    base_url_env: LOCAL_LLAMA_CODER_URL
    context: 32768          # as registered in the Pi extension, not 65K
    reasoning_capable: false
    cost_usd_per_mtok: {input: 0.0, output: 0.0}

  kat-coder-v2.5-dev:
    provider: local_llama
    id: kat-coder-v2.5-dev
    family: kat
    base_url: http://127.0.0.1:8092
    base_url_env: LOCAL_LLAMA_KAT_URL
    context: 65536
    reasoning_capable: false
    cost_usd_per_mtok: {input: 0.0, output: 0.0}

  # ------------------------------------------------------------- OpenRouter
  deepseek-v4-flash:
    provider: openrouter
    id: deepseek/deepseek-v4-flash-0731
    family: deepseek
    context: 1310720
    reasoning_capable: true
    tool_capable: true
    cost_usd_per_mtok: {input: 0.14, output: 0.28, cache_read: 0.028}

  gemini-3.7-flash:
    provider: openrouter
    id: google/gemini-3.7-flash
    family: google
    context: 1048576
    reasoning_capable: true
    tool_capable: true
    cost_usd_per_mtok: {input: 0.375, output: 1.875, cache_read: 0.0375}

  deepseek-v4-pro:
    provider: openrouter
    id: deepseek/deepseek-v4-pro-0813
    family: deepseek
    context: 1048576
    reasoning_capable: true
    tool_capable: true
    cost_usd_per_mtok: {input: 0.66, output: 1.98, cache_read: 0.022}

  glm-5.2:
    provider: openrouter
    id: z-ai/glm-5.2
    family: zai
    context: 1048576
    reasoning_capable: true
    tool_capable: true
    cost_usd_per_mtok: {input: 0.49, output: 1.54, cache_read: 0.091}

# ------------------------------------------------------------------- roles
#
# `fallbacks: []` everywhere is deliberate. An unavailable primary FAILS CLOSED.
# There is no automatic substitution, no silent family swap and no automatic
# escalation to a more expensive model. If a fallback is ever added, a
# cross-family one additionally requires `allow_family_substitution: true`.
#
# `limits` are enforced by orchestrator/pi_rpc.py on the live worker process:
# turns, tool calls, wall clock, inactivity and BOTH budget lines.
#
# hard_usd figures below are derived from the live prices above assuming a
# bounded context packet of roughly 30-80K input tokens per call. Local roles
# carry hard_usd: 0.0 — zero EXTERNAL API spend — and are bounded instead by
# their turn, tool, wall-time and retry limits.
roles:
  scout:
    description: Cheap reconnaissance, classification, first-pass reading. Local first.
    primary: qwen3.8-27b
    reasoning: medium
    fallbacks: []
    allow_weaker_fallback: false
    limits:
      max_model_calls: 2
      max_tool_calls: 4
      wall_seconds: 180
      inactivity_seconds: 90
      max_retries: 1
      soft_usd: 0.0
      hard_usd: 0.0

  scout_remote:
    description: >-
      Remote scout. Reachable only when a run explicitly selects it; local
      availability is not a permission to leave the local tier, and remote
      availability is not a permission to leave it either.
    primary: deepseek-v4-flash
    reasoning: medium
    fallbacks: []
    allow_weaker_fallback: false
    limits:
      max_model_calls: 2
      max_tool_calls: 4
      wall_seconds: 240
      inactivity_seconds: 120
      max_retries: 1
      soft_usd: 0.02
      hard_usd: 0.04

  writer:
    description: Default serious implementation and documentation work.
    primary: gemini-3.7-flash
    reasoning: high
    fallbacks: []
    allow_weaker_fallback: false
    limits:
      max_model_calls: 6
      max_tool_calls: 12
      wall_seconds: 720
      inactivity_seconds: 240
      max_retries: 1
      soft_usd: 0.20
      hard_usd: 0.40

  writer_local:
    description: >-
      Optional local implementation tier. NOT a fallback and never routed
      automatically: a run must select it, and its server must actually answer.
    primary: qwen3-coder-30b
    reasoning: medium
    fallbacks: []
    allow_weaker_fallback: false
    limits:
      max_model_calls: 6
      max_tool_calls: 12
      wall_seconds: 900
      inactivity_seconds: 300
      max_retries: 1
      soft_usd: 0.0
      hard_usd: 0.0

  fixer:
    description: One bounded correction cycle against an exact deterministic failure.
    primary: qwen3.8-27b
    reasoning: medium
    fallbacks: []
    allow_weaker_fallback: false
    limits:
      max_model_calls: 3
      max_tool_calls: 6
      wall_seconds: 360
      inactivity_seconds: 150
      max_retries: 1
      soft_usd: 0.0
      hard_usd: 0.0

  fixer_remote:
    description: Remote repair, same cheap family as the writer. Explicitly selected only.
    primary: gemini-3.7-flash
    reasoning: medium
    fallbacks: []
    allow_weaker_fallback: false
    limits:
      max_model_calls: 3
      max_tool_calls: 6
      wall_seconds: 360
      inactivity_seconds: 150
      max_retries: 1
      soft_usd: 0.06
      hard_usd: 0.12

  reviewer:
    description: >-
      Independent review from a different family than the writer. Receives a
      deterministic review packet, has ZERO tools, and answers exactly once.
    primary: deepseek-v4-pro
    reasoning: high
    fallbacks: []
    allow_weaker_fallback: false
    limits:
      max_model_calls: 2
      max_tool_calls: 0
      wall_seconds: 300
      inactivity_seconds: 180
      max_retries: 0
      soft_usd: 0.12
      hard_usd: 0.25

  resolver:
    description: >-
      Material architectural or requirement disagreements ONLY. Never routine
      work, never a "final verifier", never part of a green workflow.
    primary: glm-5.2
    reasoning: xhigh
    fallbacks: []
    allow_weaker_fallback: false
    limits:
      max_model_calls: 1
      max_tool_calls: 0
      wall_seconds: 420
      inactivity_seconds: 240
      max_retries: 0
      soft_usd: 0.08
      hard_usd: 0.15

# Whole-run budget. Checked before every paid generation alongside the role
# budget and the daily cap. Crossing the hard line requires a human, not a flag.
run_budget:
  soft_usd: 0.60
  hard_usd: 1.00

# Escalation: (stage, complexity) -> role. `complexity` defaults to the task's
# own `risk` field and can be overridden per run with --complexity.
#
# An unknown (stage, complexity) pair resolves to NO role and FAILS CLOSED.
# There is deliberately no default role: a stage nobody configured must stop the
# run, not quietly borrow someone else's model and budget.
escalation:
  low:
    scout: scout
    plan: writer
    implement: writer
    fix: fixer
    review: reviewer
  medium:
    scout: scout
    plan: writer
    implement: writer
    fix: fixer
    review: reviewer
  high:
    scout: scout
    plan: writer
    implement: writer
    fix: fixer
    review: reviewer
    resolve: resolver
  very_high:
    scout: scout
    plan: writer
    implement: writer
    fix: fixer
    review: reviewer
    resolve: resolver

# Model privileges per stage, enforced by argv, not by asking the model nicely.
# Reviewers and resolvers get `--no-tools`: the process is handed no tool at all.
privileges:
  scout:      {tools: none,  bash: false, write_set_only: false}
  plan:       {tools: none,  bash: false, write_set_only: false}
  review:     {tools: none,  bash: false, write_set_only: false}
  resolve:    {tools: none,  bash: false, write_set_only: false}
  implement:  {tools: edit,  bash: false, write_set_only: true}
  fix:        {tools: edit,  bash: false, write_set_only: true}

diversity:
  # For these complexity levels, implement / review must not come from one
  # family. Violations are reported, never silently accepted.
  enforce_for: [high, very_high]
