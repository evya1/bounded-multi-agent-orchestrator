# Model routing table — CONFIGURATION, not architecture.
#
# Copy to config/models.yaml to change routing without touching Python. The
# loader prefers models.yaml and falls back to this file.
#
# Cost figures are catalog metadata (USD per million tokens) read from Pi's
# non-secret model store. They are ESTIMATES for pre-call budgeting. Actual
# spend is taken from Pi's reported per-call usage where available.

adapters:
  pi:
    executable: pi
    # Discovered from the installed Pi build (0.84.2):
    #   -p / --print       non-interactive
    #   --mode json        JSON event stream on stdout (carries usage + cost)
    #   --provider/--model provider and model selection
    #   -nt / --no-tools   no tools at all (planner / reviewer)
    #   -t / --tools       strict allowlist for built-in AND extension tools
    #   -xt/--exclude-tools denylist
    #   --thinking <level> off|minimal|low|medium|high|xhigh|max
    print_flag: "-p"
    json_mode_flag: ["--mode", "json"]
    enabled: true
  claude:
    executable: claude
    enabled: false          # separate adapter; off by default

providers:
  # ---------------------------------------------------------------- local/free
  llama_cpp:
    kind: local
    paid: false
    # Pi talks to a llama.cpp ROUTER server (llama-server started WITHOUT -m).
    # Configured through LLAMA_BASE_URL / LLAMA_API_KEY or `/login llama.cpp`.
    pi_provider: llama.cpp
    base_url_env: LLAMA_BASE_URL
    default_base_url: http://127.0.0.1:8080
    # NOT SET DELIBERATELY. Two local Qwen GGUFs exist on this machine and the
    # router was not running at discovery time, so the exact router-side model
    # ID could not be observed. `doctor` reports this as UNDISCOVERED and the
    # router REFUSES local execution until a human fills this in.
    model_id: null
    discovered_candidates:
      - file: /root/local-agent-stack/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
        label: "Qwen3.6 35B-A3B UD-Q4_K_M (the user's 'Qwen3.6')"
        tool_use: true
        reasoning: true        # emits reasoning_content before tool calls
        context: 65536
        note: "RUNBOOK serves this single-model on port 8091, not router mode."
      - file: /root/local-agent-stack/models/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
        label: "Qwen3-Coder 30B-A3B Q4_K_M"
        tool_use: true
        reasoning: false
        context: 65536
        note: "RUNBOOK serves this single-model on port 8090, not router mode."

  # --------------------------------------------------------- OpenRouter / paid
  openrouter:
    kind: cloud
    paid: true
    pi_provider: openrouter
    api_key_env: OPENROUTER_API_KEY
    catalog: /root/.pi/agent/models-store.json   # non-secret; carries cost metadata

# Model definitions. `family` drives the diversity policy: an important review
# should not come from the same family that wrote the code.
#
# Cost figures are catalog metadata read from Pi's non-secret model store
# (USD per million tokens), recorded 2026-08-17. They are estimates for
# pre-call budgeting, never an invoice.
models:
  local-qwen36:
    provider: llama_cpp
    family: qwen
    cost_usd_per_mtok: {input: 0.0, output: 0.0}
  deepseek-v4-flash:
    provider: openrouter
    id: deepseek/deepseek-v4-flash-0731
    family: deepseek
    cost_usd_per_mtok: {input: 0.14, output: 0.28, cache_read: 0.028}
  glm-5.2:
    provider: openrouter
    id: z-ai/glm-5.2
    family: zai
    # 262K context and a 4.1K maximum output: give this role bounded,
    # single-task work rather than one very large diff.
    cost_usd_per_mtok: {input: 0.63, output: 1.98, cache_read: 0.0945}
  deepseek-v4-pro:
    provider: openrouter
    id: deepseek/deepseek-v4-pro
    family: deepseek
    cost_usd_per_mtok: {input: 1.168, output: 2.336, cache_read: 0.09855}
  mimo-v2.5:
    provider: openrouter
    id: xiaomi/mimo-v2.5
    family: xiaomi
    cost_usd_per_mtok: {input: 0.14, output: 0.28, cache_read: 0.0028}
  claude-sonnet-5:
    provider: openrouter
    id: anthropic/claude-sonnet-5
    family: anthropic
    cost_usd_per_mtok: {input: 2.0, output: 10.0, cache_read: 0.2, cache_write: 2.5}

# Role -> intended model. `fallbacks` are tried in order only when the primary
# is unavailable, and the router ALWAYS reports the substitution. A role that
# must not be downgraded sets `allow_weaker_fallback: false` and refuses.
#
# `reasoning` is optional and maps to Pi's normalized --thinking scale
# (off|minimal|low|medium|high|xhigh|max). It belongs to the ROLE, not the
# model: the same model serves the writer at `high` and the resolver at
# `xhigh`. Omit the key to leave a model at its provider default. Every level
# below was checked against its model on 2026-08-17 and accepted.
roles:
  scout:
    description: Cheap reconnaissance, classification, and first-pass diff reading.
    primary: deepseek-v4-flash
    reasoning: medium
    fallbacks: [claude-sonnet-5]
    allow_weaker_fallback: true
  writer:
    description: Default serious implementation and documentation work.
    primary: glm-5.2
    reasoning: high
    fallbacks: [claude-sonnet-5]
    allow_weaker_fallback: true
  reviewer:
    description: Independent review. A different family from the writer by design.
    primary: deepseek-v4-pro
    reasoning: high
    fallbacks: [claude-sonnet-5]
    allow_weaker_fallback: true
  cheap_reviewer:
    description: Second opinion where a full high-cost review is not justified.
    primary: mimo-v2.5
    reasoning: medium
    fallbacks: [claude-sonnet-5]
    allow_weaker_fallback: true
  resolver:
    description: Genuine requirements or architecture conflicts only. Never routine work.
    primary: glm-5.2
    reasoning: xhigh
    fallbacks: []
    allow_weaker_fallback: false
  resolver_crosscheck:
    description: Independent cross-check of a material resolver decision. Not automatic.
    primary: deepseek-v4-pro
    reasoning: xhigh
    fallbacks: []
    allow_weaker_fallback: false
  local_executor:
    description: >-
      Bounded routine implementation on a local model. Not routed by default:
      providers.llama_cpp.model_id is still UNDISCOVERED, so the router refuses
      it. Kept so a human can route work here once that is filled in.
    primary: local-qwen36
    fallbacks: []
    allow_weaker_fallback: false

# Escalation: (stage, complexity) -> role. `complexity` defaults to the task's
# own `risk` field and can be overridden per run with --complexity.
#
# Escalate only when the cheaper step cannot answer the question:
#   deterministic tool -> scout -> writer -> reviewer -> resolver
#   -> resolver_crosscheck -> fallback
#
# `scout`, `resolve` and `resolve_crosscheck` are routed here but have no v4
# stage yet; they are reachable through --model today and are already wired for
# when those stages land. `plan` uses the writer role because planning is
# writing, not reviewing.
escalation:
  low:
    scout: scout
    plan: writer
    implement: writer
    review: cheap_reviewer
  medium:
    scout: scout
    plan: writer
    implement: writer
    review: reviewer
  high:
    scout: scout
    plan: writer
    implement: writer
    review: reviewer
    resolve: resolver
  very_high:
    scout: scout
    plan: writer
    implement: writer
    review: reviewer
    resolve: resolver
    resolve_crosscheck: resolver_crosscheck

# Model privileges per stage. Planners and reviewers get NO tools at all — this
# is enforced by the adapter's argv, not by asking the model nicely.
privileges:
  plan:       {tools: none,  bash: false, write_set_only: false}
  review:     {tools: none,  bash: false, write_set_only: false}
  implement:  {tools: edit,  bash: false, write_set_only: true}

diversity:
  # For these complexity levels, plan / implement / review must not all come
  # from one model family. Violations are reported, never silently accepted.
  enforce_for: [high, very_high]
